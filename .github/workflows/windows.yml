name: Windows release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release version (vMAJOR.MINOR.PATCH)
        type: string
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      MOON_BUILD_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PowerShell scripts
        shell: powershell
        run: ./scripts/check-scripts.ps1
      - name: Install NSIS if needed
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
              choco install nsis -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
            }
            $nsis >> $env:GITHUB_PATH
          }
      - name: Build and verify Windows x64 package
        shell: pwsh
        run: ./scripts/build-release.ps1 -Tag $env:MOON_BUILD_TAG -Out target/moon-windows-release
      - name: Upload installer and portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Moon-Viewer-${{ inputs.tag }}-windows-x64
          path: target/moon-windows-release/
          if-no-files-found: error
          compression-level: 0
