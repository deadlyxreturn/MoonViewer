name: Windows release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release version (vMAJOR.MINOR.PATCH)
        type: string
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      MOON_BUILD_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PowerShell scripts
        shell: powershell
        run: ./scripts/check-scripts.ps1
      - name: Install NSIS if needed
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
              choco install nsis -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
            }
            $nsis >> $env:GITHUB_PATH
          }
      - name: Build and verify Windows x64 package
        shell: pwsh
        run: ./scripts/build-release.ps1 -Tag $env:MOON_BUILD_TAG -Out target/moon-windows-release
      - name: Upload installer and portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Moon-Viewer-${{ inputs.tag }}-windows-x64
          path: target/moon-windows-release/
          if-no-files-found: error
          compression-level: 0
      - name: Publish the release (installer and portable zip)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem target/moon-windows-release -File | ForEach-Object FullName
          gh release view $env:MOON_BUILD_TAG -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:MOON_BUILD_TAG @files --clobber -R $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:MOON_BUILD_TAG @files --target $env:GITHUB_SHA --title "Moon Viewer $($env:MOON_BUILD_TAG.Substring(1))" --notes "Moon Viewer for Windows: run Moon-Viewer-Setup to install." -R $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed ($LASTEXITCODE)" }
      - name: Capture login and Preferences screenshots
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $zip = Get-ChildItem target/moon-windows-release -Recurse -Filter 'Moon-Viewer-*-windows-x64.zip' | Select-Object -First 1
          $tmp = Join-Path $env:RUNNER_TEMP 'moon-portable'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $tmp -Force
          $exe = Get-ChildItem $tmp -Recurse -Filter 'moon-viewer.exe' | Select-Object -First 1
          $shots = New-Item -ItemType Directory -Force -Path target/moon-screenshots
          foreach ($scene in 'Login', 'Preferences') {
            try { ./scripts/capture-moon.ps1 -Exe $exe.FullName -Out $shots.FullName -Scene $scene }
            catch { Write-Warning $_ }
          }
      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Moon-Viewer-screenshots
          path: target/moon-screenshots/
          if-no-files-found: warn
